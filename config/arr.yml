# Desired state of the *arr stack. Applied by ./scripts/apply_arr_config.py (idempotent, --check for a dry run).
#
# ${VAR} / ${VAR:-default} are replaced with values from .env, so no secret lives in this file.
# Hosts below are the ones the apps use to reach each other from INSIDE Gluetun's network namespace
# (that is why everything is localhost). Indexers are deliberately not managed here: add them in Prowlarr.

# Web UI login (Forms authentication, always required) for Sonarr, Radarr and Prowlarr.
# Leave ARR_USERNAME empty in .env to skip.
auth:
  username: ${ARR_USERNAME:-}
  password: ${ARR_PASSWORD:-}

qbittorrent:
  username: ${QBITTORRENT_USERNAME:-admin}
  password: ${QBITTORRENT_PASSWORD:-}
  preferences:
    save_path: /data/downloads/complete         # finished torrents (Sonarr/Radarr import from here)
    temp_path_enabled: true                     # keep unfinished torrents apart...
    temp_path: /data/downloads/incomplete       # ...here; qBittorrent moves them to save_path when done
    incomplete_files_ext: true                  # unfinished files get .!qB, so nothing can import or scan them half-done
    upnp: false                      # useless behind Mullvad (no port forwarding)
    current_network_interface: tun0  # refuse to use anything but the VPN interface
    # Queue limits (qBittorrent's defaults are 3 downloads / 5 torrents / 3 uploads, which leaves most of them "Queued").
    # Generous on purpose: seeding torrents (3 days) count towards max_active_torrents too.
    queueing_enabled: true
    max_active_downloads: 20
    max_active_torrents: 60
    max_active_uploads: 30
    dont_count_slow_torrents: true              # stalled/slow torrents don't take a slot
  # Clean-up of finished downloads. Counted as days of SEEDING after the torrent finished. Your library keeps its
  # files because Sonarr/Radarr import by hardlink (`hardlinks: true` below). Public trackers only: a private
  # tracker wants a ratio or a longer seeding time.
  cleanup:
    delete_after_seeding_days: 3                # 0 = never delete anything
    # false (chosen): qBittorrent deletes the torrent AND its files by itself after that time. Plex keeps its copy because
    #   Sonarr/Radarr import by hardlink. A download that was never imported is deleted too.
    # true: after that time qBittorrent only STOPS the torrent; Sonarr/Radarr then delete it, but only if THEY imported it.
    only_after_import: false
    delete_files: true                          # only when only_after_import is false; false = remove the torrent, keep the files on disk

sonarr:
  hardlinks: true                    # import by hardlink: instant, no extra disk space
  # A file that was downloaded is NEVER replaced by a better one. false turns "Upgrades Allowed" off in every quality
  # profile (also the old ones your existing titles use) and sets Propers/Repacks to "Do Not Prefer". The search still
  # takes the best quality available WHEN it runs; it just never comes back for a better one later.
  upgrades: false
  root_folders:
    - /data/media/tv-shows
  download_client:
    name: qBittorrent
    host: localhost
    port: 8080
    category: tv
  # Fake "new episode" files (executables, archives with a password) are often posted the day before an episode
  # airs. Two defences, both in one Sonarr release profile:
  release_profile:
    reject_unaired: true             # refuse releases published before the episode aired. Needs a NEWER Sonarr than 4.0.20:
                                     # on an older one it is skipped (the script says so) and only `ignored` applies
    grace_days: 0                    # 0 = published at or after the air date; negative allows earlier, positive waits
    ignored:                         # title patterns that reject a release: a torrent named like a file ending in .exe is a fake
      - '/\.(exe|msi|scr|bat|cmd|com|lnk|vbs|js|jar|apk)$/'
  quality_profile:                   # created by Recyclarr (config/recyclarr/configs/media.yml)
    name: TV - best available         # 1080p, then 720p, then 480p (see config/recyclarr/configs/media.yml)
    # Which titles already in Sonarr get this profile:
    #   without_files = only those with no file yet (nothing to replace: safe, and what makes new/missing titles
    #                   follow this profile instead of an old one that allows 2160p). Re-run to catch new ones.
    #   true          = every title. DANGER: a file whose quality is not in the profile counts as "upgradable", so
    #                   any release the profile allows may replace it (remuxes are not in the profile, and Sonarr's stops at 1080p).
    #   false         = none.
    assign_to_existing: without_files
  remove_download_clients:           # leftovers from the previous setup
    - Deluge

radarr:
  hardlinks: true
  upgrades: false                    # same as in the sonarr section: a downloaded movie is never replaced
  root_folders:
    - /data/media/movies
  download_client:
    name: qBittorrent
    host: localhost
    port: 8080
    category: movies
  quality_profile:
    name: Movies - best available     # Bluray/4K, then 1080p, 720p, 480p (see config/recyclarr/configs/media.yml)
    assign_to_existing: without_files   # same options and warning as in the sonarr section
  remove_download_clients:
    - Deluge

prowlarr:
  flaresolverr:
    host: http://localhost:8191/
    tag: flaresolverr                # give this tag to the indexers that need Cloudflare solving
  # Releases with fewer seeders are rejected by Sonarr/Radarr (they pick the next best one instead: this is what makes
  # the quality ladder walk down). One value for every quality: the apps have no per-quality threshold. 10 because a
  # 4K film weighs 10-25 GB and, without port forwarding on Mullvad, a torrent with few seeders crawls; popular titles
  # have far more. If a niche title never downloads, lower it (or use Interactive Search in the app for that one).
  # It goes into Prowlarr's app profiles and reaches every indexer that has no minimum of its own. Prowlarr's default: 1.
  minimum_seeders: 10
  apps:
    sonarr:
      prowlarr_url: http://localhost:9696
      url: http://localhost:8989
    radarr:
      prowlarr_url: http://localhost:9696
      url: http://localhost:7878
  # Indexers whose site definition was removed upstream cannot work any more and keep Prowlarr's health warning
  # "have no definition". true = delete them on the next run. false = leave them alone.
  remove_orphaned_indexers: true
  # Public trackers, as a starting point: edit freely. `definition` is the name in Prowlarr's indexer list.
  # Private trackers need credentials: put them in .env and reference them, e.g.
  #   - definition: mytracker
  #     fields: {username: ${MYTRACKER_USER}, password: ${MYTRACKER_PASS}}
  indexers:
    - yts                            # movies
    - definition: eztv               # TV
      tags: [flaresolverr]
    - thepiratebay
    - definition: 1337x
      tags: [flaresolverr]

# File names that are never wanted inside a download. One list, two users: qBittorrent never writes them to disk
# (`Excluded file names`, applied by ./scripts/apply_download_safety.py) and the Cleanuparr Malware Blocker skips them
# and drops a download that contains nothing else. Wildcards, case-insensitive; a `*` at the start means "ends with".
# Archives (.rar .zip .7z) do NOT belong here: Unpackerr extracts them and they hold real releases. Harmless to
# over-match: a skipped stray file costs nothing.
blocked_files:
  - "*.exe"
  - "*.msi"
  - "*.bat"
  - "*.cmd"
  - "*.com"
  - "*.scr"
  - "*.pif"
  - "*.lnk"
  - "*.vbs"
  - "*.vbe"
  - "*.js"
  - "*.jse"
  - "*.wsf"
  - "*.wsh"
  - "*.ps1"
  - "*.sh"
  - "*.jar"
  - "*.dll"
  - "*.apk"
  - "*.hta"
  - "*.reg"
  - "*.cpl"
  - "*.dmg"
  - "*.pkg"
  - "*.iso"

# Cleanuparr (http://<LAN_IP>:11011): removes downloads that will never finish, blocklists the release and makes
# Sonarr/Radarr search again. Applied by ./scripts/apply_cleanuparr_config.py (--check to preview). Login: `auth:` above
# (password of 8+ characters). Schedules are Quartz cron expressions, seconds first.
cleanuparr:
  general:
    dry_run: false                   # true: only log what would be removed (Cleanuparr's log), change nothing. Try it first if you like
    display_support_banner: false
    status_check_enabled: false      # no "is there a newer Cleanuparr" call; Renovate proposes the update
    # VPN down = everything looks stalled: skip the run unless gluetun's health server (same namespace) answers 200.
    connectivity_check_enabled: true
    connectivity_check_urls:
      - http://localhost:9999
  download_client:
    name: qBittorrent
    type_name: qBittorrent
    host: http://localhost:8080
    username: ${QBITTORRENT_USERNAME:-admin}
    password: ${QBITTORRENT_PASSWORD:-}
  arrs:                              # API keys come from .env (filled by apply_arr_config.py)
    sonarr: {url: "http://localhost:8989", api_key: "${SONARR_API_KEY:-}", version: 4}
    radarr: {url: "http://localhost:7878", api_key: "${RADARR_API_KEY:-}", version: 6}
  queue_cleaner:
    enabled: true
    cron: "0 0/5 * * * ?"            # every 5 minutes
    downloading_metadata_max_strikes: 12   # a magnet link that never gets its metadata: 12 runs = 1 hour
    process_no_content_id: false     # leave alone what Sonarr/Radarr cannot tie to a title (no search is possible for it)
    ignored_downloads: []            # hash, category, tag or tracker domain; those are never touched
    # A torrent whose files were ALL refused (qBittorrent's excluded names) is removed at once: nothing to set.
    # A finished download Sonarr/Radarr cannot import, only for reasons another release would fix. What fixes itself
    # ("still being unpacked", "Found archive file" while Unpackerr works, "not enough free space") is left alone.
    # Add `Found archive file` to also drop password-protected fake archives (it then waits max_strikes runs).
    failed_import:
      max_strikes: 12                # 0 = never remove failed imports; otherwise at least 3
      pattern_mode: Include
      patterns:
        - title mismatch
        - not found in the grabbed release
        - was unexpected considering
        - No files found are eligible for import
        - not imported or missing
        - Unable to parse
    # Download not moving for `max_strikes` consecutive runs (progress resets the count). Private torrents are only
    # taken out of the app's queue, never deleted from qBittorrent (a private tracker punishes that).
    stall_rules:
      - name: Stalled
        max_strikes: 12              # 12 runs = 1 hour without a byte
        privacy_type: Both
        min_completion_percentage: 0
        max_completion_percentage: 100
        reset_strikes_on_progress: true
    # Optional: remove downloads that crawl. Left empty on purpose (a 4K film is slow behind Mullvad without port
    # forwarding, and that is normal). Example:
    #   - {name: Crawling, max_strikes: 36, privacy_type: Public, min_speed: 100KB, ignore_above_size: 25GB,
    #      min_completion_percentage: 0, max_completion_percentage: 90}
    slow_rules: []
  malware_blocker:
    enabled: true
    cron: "0 0/5 * * * ?"
    ignore_private: false
    delete_private: false
    process_no_content_id: false
    # false: a download is removed only when ALL its files are blocked; otherwise just the blocked files are skipped.
    # true: any blocked file removes the whole download (a real release rarely carries an .exe, but promo files like
    # "www.site.com" match `*.com`).
    delete_if_any_file_blocked: false
    ignored_downloads: []

plex:
  preferences:                       # ids as listed by Plex itself; unknown ones are skipped, empty values are ignored
    PublishServerOnPlexOnlineKey: true          # Settings > Remote Access: on
    ManualPortMappingMode: true                 # ...with a manually forwarded port (UPnP cannot work from inside Docker)
    ManualPortMappingPort: 32400                # the public TCP port you forward on the router to this server
    LanNetworksBandwidth: ${LAN_SUBNETS}        # Settings > Network > LAN Networks: treated as local (put your home subnet here too)
    customConnections: ${PLEX_CUSTOM_URLS:-}    # extra URLs Plex advertises: Tailscale address, a DDNS name (comma separated)
    TranscoderTempDirectory: /transcode         # the 6 GB tmpfs of compose.yml: transcoding happens in RAM (the image default is the disk)
    HardwareAcceleratedCodecs: true             # Settings > Transcoder > hardware acceleration (needs Plex Pass and /dev/dri)
  libraries:                         # Plex mounts $DATA_DIR at /data/media, hence the doubled "data/media"
    - {name: Movies, type: movie, path: /data/media/data/media/movies}
    - {name: TV Shows, type: show, path: /data/media/data/media/tv-shows}
