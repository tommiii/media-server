# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
#
# Synced by the `recyclarr` container daily (it does NOT sync on start-up: run the first one by hand,
#   docker compose exec recyclarr recyclarr sync ).
# Recyclarr shares gluetun's network namespace, so Sonarr/Radarr are on localhost.
# API keys come from the container environment (.env -> SONARR_API_KEY / RADARR_API_KEY).
#
# Profiles/formats are the TRaSH Guides ones. Templates with more options (2160p, remux, anime, ...):
# https://github.com/recyclarr/config-templates
#
# FILE SIZE LIMITS live in the `quality_definition` blocks below, in MB per minute of runtime:
#   size = value x runtime.  Radarr: a 120 min film.  Sonarr: per episode, a 45 min episode.
#   Releases above `max` are rejected, releases closest to `preferred` win among equals, below `min` are rejected.
#   TRaSH's own values are "max 2000, preferred 1999" (= unlimited, biggest wins): overridden here on purpose.
#
# Preview what would change without touching anything:
#   docker compose exec recyclarr recyclarr sync --preview

sonarr:
  series:
    base_url: http://localhost:8989
    api_key: !env_var SONARR_API_KEY

    quality_definition:
      type: series
      # MB/min per episode (45 min episode: 60 -> 2.7 GB, 100 -> 4.5 GB, 150 -> 6.7 GB).
      # `min` stays at TRaSH's value except where noted: the fallback qualities (720p, Bluray-1080p) must accept the
      # small releases that really exist, while still rejecting the tiny fakes (a 3 MB "episode" is far below any min).
      qualities:
        - name: WEBDL-1080p
          preferred: 25
          max: 60
        - name: WEBRip-1080p
          preferred: 25
          max: 60
        - name: Bluray-1080p
          min: 25                        # TRaSH: 50.4
          preferred: 60
          max: 100
        - name: HDTV-1080p
          preferred: 25
          max: 60
        - name: WEBDL-720p
          min: 5                         # TRaSH: 10
          preferred: 12
          max: 30
        - name: WEBRip-720p
          min: 5                         # TRaSH: 10
          preferred: 12
          max: 30
        - name: Bluray-720p
          min: 8                         # TRaSH: 17.1
          preferred: 25
          max: 50
        - name: HDTV-720p
          min: 5                         # TRaSH: 10
          preferred: 15
          max: 35
        - name: Bluray-1080p Remux
          preferred: 75
          max: 100
        - name: WEBDL-2160p
          preferred: 60
          max: 150
        - name: WEBRip-2160p
          preferred: 60
          max: 150
        - name: HDTV-2160p
          preferred: 60
          max: 150
        - name: Bluray-2160p
          preferred: 120
          max: 200
        - name: Bluray-2160p Remux
          preferred: 190
          max: 200

    quality_profiles:
      # Based on TRaSH's WEB-1080p profile (keeps its custom formats and scores), renamed, with our own ladder.
      # Qualities are tried in this order: the FIRST one that has a release with enough seeders
      # (minimum_seeders in config/arr.yml) wins; the custom format scores only break ties within a quality.
      - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        name: TV - best available
        upgrade:
          allowed: false                 # a downloaded episode is never replaced by a better one
          until_quality: WEB 1080p       # required by Recyclarr next to a qualities list; meaningless while upgrades are off
        qualities:
          - name: WEB 1080p
            qualities: [WEBDL-1080p, WEBRip-1080p]
          - name: Bluray-1080p
          - name: HDTV-1080p
          - name: WEB 720p
            qualities: [WEBDL-720p, WEBRip-720p]
          - name: Bluray-720p
          - name: HDTV-720p
          - name: WEB 480p
            qualities: [WEBDL-480p, WEBRip-480p]
          - name: Bluray-480p
          - name: DVD
          - name: SDTV
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: 158188097a58d7687dee647e04af0da3 # [Optional] Golden Rule HD
          exclude:
          select:
        - trash_id: 85fae4a2294965b75710ef2989c850eb # [Streaming Services] HD/UHD boost
          exclude:
        # Penalizes BR-DISK, LQ, LQ (Release Title), Extras, Upscaled, ...: the fake/low-quality
        # releases that are most often the ones carrying junk instead of video.
        - trash_id: 59c3af66780d08332fdc64e68297098f # [Unwanted] Unwanted Formats
          exclude:
          select:
      skip:

radarr:
  movies:
    base_url: http://localhost:7878
    api_key: !env_var RADARR_API_KEY

    quality_definition:
      type: movie
      # MB/min (120 min film: 30 -> 3.6 GB, 60 -> 7.2 GB, 110 -> 13 GB, 160 -> 19 GB, 200 -> 24 GB).
      # `min` stays at TRaSH's value except where noted, so that the fallback qualities accept the small releases that
      # really exist (a 1 GB 720p film) while the tiny fakes stay far below any min. Remux caps sit just above their
      # minimum, so remuxes never fit (>40 GB).
      qualities:
        - name: WEBDL-1080p
          preferred: 30
          max: 60
        - name: WEBRip-1080p
          preferred: 30
          max: 60
        - name: Bluray-1080p
          min: 20                        # TRaSH: 50.8
          preferred: 70
          max: 110
        - name: WEBDL-720p
          min: 6                         # TRaSH: 12.5
          preferred: 15
          max: 40
        - name: WEBRip-720p
          min: 6                         # TRaSH: 12.5
          preferred: 15
          max: 40
        - name: Bluray-720p
          min: 8                         # TRaSH: 25.7
          preferred: 30
          max: 60
        - name: Remux-1080p
          preferred: 105
          max: 110
        - name: WEBDL-2160p
          preferred: 100
          max: 160
        - name: WEBRip-2160p
          preferred: 100
          max: 160
        - name: HDTV-2160p
          preferred: 100
          max: 160
        - name: Bluray-2160p
          min: 60                        # TRaSH: 102
          preferred: 150
          max: 200
        - name: Remux-2160p
          preferred: 190
          max: 200

    quality_profiles:
      # Based on TRaSH's HD Bluray + WEB profile (keeps its custom formats and scores), renamed, with our own ladder:
      # Bluray/4K first, then 1080p, 720p and 480p. The FIRST quality that has a release with enough seeders
      # (minimum_seeders in config/arr.yml) wins; custom format scores only break ties within a quality.
      - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
        name: Movies - best available
        upgrade:
          allowed: false                 # a downloaded movie is never replaced by a better one
          until_quality: Bluray-2160p    # required by Recyclarr next to a qualities list; meaningless while upgrades are off
        qualities:
          - name: Bluray-2160p
          - name: WEB 2160p
            qualities: [WEBDL-2160p, WEBRip-2160p]
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities: [WEBDL-1080p, WEBRip-1080p]
          - name: Bluray-720p
          - name: WEB 720p
            qualities: [WEBDL-720p, WEBRip-720p]
          - name: WEB 480p
            qualities: [WEBDL-480p, WEBRip-480p]
          - name: Bluray-480p
          - name: DVD
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: f8bf8eab4617f12dfdbd16303d8da245 # [Optional] Golden Rule HD
          exclude:
          select:
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df # [Unwanted] Unwanted Formats
          exclude:
          select:
      skip:
